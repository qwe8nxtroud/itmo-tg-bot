# Дополнение к compose.yaml для серверов, где Telegram доступен только по IPv6
# (из российских сетей IPv4-маршрут к api.telegram.org часто не работает).
# Контейнеры получают адрес IPv6, и запросы к Telegram идут по нему:
#   COMPOSE_EXTRA=compose.ipv6.yaml bash scripts/deploy_server.sh <ssh-хост>
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd42:7470:6b2::/64
